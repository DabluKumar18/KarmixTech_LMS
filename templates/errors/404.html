{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block body_class %}landing-layout{% endblock %}

{% block content %}
<main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gray-50);">
    <div style="text-align: center; padding: 2rem;">
        <div style="font-size: 8rem; font-weight: 800; color: var(--gray-200); line-height: 1;">404</div>
        <h1 style="font-size: 1.5rem; margin: 1rem 0 0.5rem;'>Page Not Found</h1>
        <p style="color: var(--gray-500); margin-bottom: 2rem; max-width: 400px;">
            The page you're looking for doesn't exist or has been moved. Let's get you back on track.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</main>
{% endblock %}
